<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>School World MMO - Room Engine V1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:10px;left:10px;z-index:5;color:#fff;text-shadow:0 1px 3px #000;font-size:13px}
.pill{display:inline-block;background:#0008;padding:4px 8px;border-radius:10px;margin-top:4px}
#action{position:fixed;right:18px;bottom:125px;z-index:8;width:88px;height:88px;border:0;border-radius:50%;background:#fffde;color:#222;font-weight:800}
#chat{position:fixed;right:12px;bottom:12px;z-index:8;display:flex;gap:6px}
#chat input{width:min(230px,52vw);height:42px;border:0;border-radius:12px;padding:0 12px;font-size:16px}
#chat button{height:42px;border:0;border-radius:12px;padding:0 14px;font-weight:700}
#joystick{position:fixed;left:18px;bottom:20px;width:112px;height:112px;border-radius:50%;background:#ffffff33;border:2px solid #fff7;z-index:8;touch-action:none}
#stick{position:absolute;left:31px;top:31px;width:46px;height:46px;border-radius:50%;background:#fff}
#popup{display:none;position:fixed;inset:0;z-index:20;background:#0008;align-items:center;justify-content:center;padding:20px}
#popup .box{max-width:420px;width:100%;background:#fff;border-radius:18px;padding:20px}
#popup h3{margin-top:0}.bubble{position:absolute;z-index:7;background:#fff;color:#222;padding:6px 9px;border-radius:10px;font-size:12px}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><b id="room">Room: halaman</b><br><span class="pill" id="status">● engine aktif</span></div>
<button id="action">ACTION</button>
<div id="chat"><input id="chatInput" maxlength="120" placeholder="Chat..."><button id="send">Kirim</button></div>
<div id="joystick"><div id="stick"></div></div>
<div id="popup"><div class="box"><h3 id="popTitle"></h3><div id="popBody"></div><br><button id="popClose">Tutup</button></div></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const rooms={
halaman:{w:1800,h:1000,bg:'#78b96b',spawn:{x:260,y:500},objects:[
{id:'school',type:'building',x:520,y:180,w:760,h:460,label:'Gedung Sekolah'},
{id:'board',type:'info',x:430,y:350,label:'Papan Informasi',content:'Selamat datang di halaman sekolah.'},
{id:'portal1',type:'portal',x:1300,y:470,w:70,h:120,label:'Pintu ke Selasar',targetRoom:'selasar',targetX:160,targetY:500}],
npcs:[{x:720,y:400,name:'Guru',behavior:'STAY'},{x:360,y:720,name:'Kucing',behavior:'WALK_RANDOM'}]},
selasar:{w:1400,h:800,bg:'#b9a77c',spawn:{x:160,y:500},objects:[
{id:'portal2',type:'portal',x:60,y:440,w:70,h:120,label:'Pintu ke Halaman',targetRoom:'halaman',targetX:1370,targetY:530},
{id:'portal3',type:'portal',x:620,y:170,w:100,h:70,label:'Kelas 1',targetRoom:'kelas1',targetX:150,targetY:400},
{id:'portal4',type:'portal',x:900,y:170,w:100,h:70,label:'Kelas 2',targetRoom:'kelas2',targetX:150,targetY:400},
{id:'board2',type:'info',x:360,y:420,label:'Papan Pengumuman',content:'Selasar sekolah. Pilih pintu untuk berpindah room.'}],
npcs:[{x:480,y:520,name:'Guru',behavior:'PATROL'}]},
kelas1:{w:900,h:650,bg:'#d8d2b8',spawn:{x:150,y:400},objects:[
{id:'back1',type:'portal',x:30,y:350,w:70,h:100,label:'Kembali',targetRoom:'selasar',targetX:670,targetY:260},
{id:'desk',type:'info',x:420,y:300,label:'Meja Guru',content:'Ruang kelas 1. Quest dan quiz akan ditambahkan berikutnya.'}],npcs:[]},
kelas2:{w:900,h:650,bg:'#c9d7d8',spawn:{x:150,y:400},objects:[
{id:'back2',type:'portal',x:30,y:350,w:70,h:100,label:'Kembali',targetRoom:'selasar',targetX:950,targetY:260},
{id:'board3',type:'info',x:430,y:300,label:'Papan Quiz',content:'Tempat quiz modular akan dibuat berikutnya.'}],npcs:[]}};
let room='halaman',player={x:260,y:500,r:22,name:'Pemain'},keys={},joy={x:0,y:0,active:false},bubbles=[],last=performance.now();
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function nearest(){let best=null,bd=1e9;for(const o of rooms[room].objects)if(o.type==='portal'||o.type==='info'){let d=Math.hypot(player.x-(o.x+(o.w||0)/2),player.y-(o.y+(o.h||0)/2));if(d<bd){bd=d;best=o}}return bd<125?best:null}
function interact(){let o=nearest();if(!o)return;if(o.type==='portal'){room=o.targetRoom;player.x=o.targetX;player.y=o.targetY;document.querySelector('#room').textContent='Room: '+room;showPopup('Pindah Room',o.label)}else showPopup(o.label,o.content)}
function showPopup(t,b){popTitle.textContent=t;popBody.textContent=b;popup.style.display='flex'}popClose.onclick=()=>popup.style.display='none';action.onclick=interact;
function input(){let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(joy.active){x=joy.x;y=joy.y}let l=Math.hypot(x,y);return l?{x:x/l,y:y/l}:{x:0,y:0}}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='e'||e.key==='Enter')interact()});addEventListener('keyup',e=>keys[e.key]=0);
const js=document.querySelector('#joystick'),st=document.querySelector('#stick');
function jm(e){let r=js.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=42,l=Math.hypot(x,y);if(l>m){x=x/l*m;y=y/l*m}st.style.transform=`translate(${x}px,${y}px)`;joy.x=x/m;joy.y=y/m}
js.onpointerdown=e=>{joy.active=true;js.setPointerCapture(e.pointerId);jm(e)};js.onpointermove=e=>{if(joy.active)jm(e)};js.onpointerup=()=>{joy.active=false;joy.x=joy.y=0;st.style.transform=''};
function chat(){let v=chatInput.value.trim();if(!v)return;bubbles=[{x:player.x,y:player.y-45,text:v,t:3}];chatInput.value=''}send.onclick=chat;chatInput.onkeydown=e=>{if(e.key==='Enter')chat()};
function update(dt){let m=input();player.x=clamp(player.x+m.x*220*dt,20,rooms[room].w-20);player.y=clamp(player.y+m.y*220*dt,20,rooms[room].h-20);bubbles.forEach(b=>b.t-=dt);bubbles=bubbles.filter(b=>b.t>0)}
function draw(){let R=rooms[room],cx=clamp(player.x-innerWidth/2,0,Math.max(0,R.w-innerWidth)),cy=clamp(player.y-innerHeight/2,0,Math.max(0,R.h-innerHeight));ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle=R.bg;ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(-cx,-cy);
for(const o of R.objects){if(o.type==='building'){ctx.fillStyle='#e8d6a8';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#222';ctx.fillText(o.label,o.x+20,o.y+30)}else if(o.type==='portal'){ctx.fillStyle='#6b4b2a';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#fff';ctx.fillText(o.label,o.x,o.y-8)}else{ctx.fillStyle='#8b5a2b';ctx.fillRect(o.x,o.y,80,55);ctx.fillStyle='#fff';ctx.fillText('INFO',o.x+18,o.y+32)}}
for(const n of R.npcs){ctx.fillStyle='#7fa7df';ctx.beginPath();ctx.arc(n.x,n.y,18,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillText(n.name,n.x-20,n.y-25)}
ctx.fillStyle='#333';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(player.name,player.x,player.y-32);ctx.restore();
for(const b of bubbles){ctx.fillStyle='#fff';ctx.fillRect(b.x-cx-75,b.y-cy-35,150,30);ctx.fillStyle='#222';ctx.fillText(b.text.slice(0,24),b.x-cx,b.y-cy-15)}ctx.textAlign='start'}
function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>

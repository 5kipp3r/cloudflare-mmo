<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}button,input{font:inherit}.hidden{display:none!important}
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#0b1220;z-index:50;overflow:auto}.authCard{width:min(450px,100%);background:#1b2638;border:1px solid #34445d;border-radius:20px;padding:20px;box-shadow:0 16px 50px #0008}.authCard h1{margin:0 0 6px;font-size:27px}.authCard p{color:#b8c4d8}.authCard input,.authCard button{width:100%;padding:13px;margin:5px 0;border-radius:12px;border:1px solid #465873}.authCard input{background:#0f1726;color:#fff;outline:none}.authCard button{border:0;background:#2864dc;color:#fff;font-weight:700}.authCard button.secondary{background:#334158}.pickerTitle{font-size:13px;font-weight:800;margin-top:8px}.spriteChoices{display:flex;gap:6px;overflow-x:auto;padding:5px 0 8px}.spriteChoice{width:62px!important;min-width:62px!important;padding:5px!important;margin:0!important;background:#26354a!important;border:1px solid #ffffff20!important;font-size:10px!important}.spritePreview{display:block;width:44px;height:44px;margin:0 auto 3px;background-size:132px 176px;background-position:0 0;background-repeat:no-repeat;image-rendering:pixelated}.spriteChoice.selected{outline:2px solid #5d9cff;background:#304e7a!important}
#game{position:fixed;inset:0;overflow:hidden;background:#79b96d}#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:max(9px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));z-index:10;pointer-events:none}.hudBox{background:#0b1220e8;border:1px solid #ffffff25;border-radius:12px;padding:8px 11px;backdrop-filter:blur(8px);font-size:11px;line-height:1.4;box-shadow:0 8px 24px #0004}.hudName{font-weight:800;font-size:14px}.online{color:#70e08a}.offline{color:#ff8b8b}.roomName{font-weight:800;color:#ffe49b}#logout{pointer-events:auto;margin-top:5px;padding:4px 8px;border:0;border-radius:7px;background:#334158;color:#fff;font-size:11px}
#joystick{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:#0b12209c;border:2px solid #ffffff40;z-index:20;touch-action:none;box-shadow:0 5px 20px #0003}#joyKnob{position:absolute;width:52px;height:52px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff38;border:2px solid #fff9;box-shadow:0 4px 16px #0005;pointer-events:none}
#rightUI{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:min(310px,55vw);z-index:20;display:flex;flex-direction:column;gap:7px;align-items:stretch}#actions{display:flex;gap:6px;justify-content:flex-end;align-items:end}.actionBtn{border:1px solid #ffffff35;background:#101c24ed;color:#fff;border-radius:12px;padding:9px 10px;font-weight:800;min-width:0;flex:1;box-shadow:0 6px 18px #0004;font-size:clamp(12px,3.3vw,17px)}
.tearWrap{position:relative;width:92px;height:72px;flex:0 0 92px}.tearAction,.tearSkill{position:absolute;border:0;color:#fff;font-weight:900;box-shadow:0 7px 18px #0005}.tearAction{left:0;top:0;width:66px;height:66px;border-radius:50%;background:#101c24ed;border:2px solid #ffffff30;z-index:2}.tearSkill{right:0;bottom:0;width:42px;height:46px;border-radius:45% 45% 55% 55%;background:#2864dc;transform:rotate(-18deg);opacity:.9}.tearSkill span{display:block;transform:rotate(18deg);font-size:9px}.tearAction span{font-size:13px}.tearAction:active,.actionBtn:active,.tearSkill:active{transform:scale(.96)}
#chat{background:#101c24e8;border:1px solid #ffffff30;border-radius:13px;backdrop-filter:blur(8px);overflow:hidden}#chatForm{display:flex}#chatInput{min-width:0;flex:1;background:transparent;color:#fff;border:0;padding:10px 8px;outline:none;font-size:13px;touch-action:auto}#chatSend{border:0;background:#2864dc;color:#fff;font-weight:800;padding:0 12px;font-size:13px}
#chatBubbles{position:fixed;inset:0;z-index:8;pointer-events:none}.worldChat{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#15202a;border-radius:12px;padding:5px 8px;font-size:12px;font-weight:700;box-shadow:0 5px 16px #0005;max-width:190px;word-break:break-word}.worldChat:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.panel{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:205px;width:min(330px,78vw);z-index:35;background:#111b2bf5;border:1px solid #ffffff2a;border-radius:15px;padding:14px;box-shadow:0 15px 40px #0008;font-size:14px}.panelClose{float:right;border:0;background:#334158;color:#fff;border-radius:7px;padding:4px 8px}.panel h3{margin:0 0 9px}.panel p{margin:7px 0;color:#dbe5f5}.panel button{border:0;border-radius:9px;background:#2864dc;color:#fff;padding:9px 12px;font-weight:700}.quizOpt{display:block;width:100%;text-align:left;margin:6px 0!important;background:#26354a!important}.quizOpt.correct{background:#267b4d!important}.quizOpt.wrong{background:#873f49!important}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:40;background:#101c24ee;border:1px solid #ffffff25;padding:9px 13px;border-radius:12px;box-shadow:0 10px 30px #0006;font-weight:700;font-size:13px}
@media(max-width:600px){#rightUI{width:min(280px,57vw)}#joystick{width:116px;height:116px}#joyKnob{width:50px;height:50px}.hudBox{font-size:10px}.hudName{font-size:13px}.panel{bottom:195px}}
</style>
</head>
<body>
<section id="auth"><div class="authCard"><h1>Cloudflare MMO</h1><p id="authTitle">Masuk ke dunia sekolah</p><input id="username" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><input id="characterName" maxlength="8" placeholder="Nickname (3–8 karakter)" class="hidden"><div id="spritePicker" class="hidden"><div class="pickerTitle">Pilih karakter</div><div class="spriteChoices" id="spriteChoices"></div></div><button id="authBtn">Login</button><button id="switchBtn" class="secondary">Buat akun baru</button><p id="authMsg"></p></div></section>
<section id="game" class="hidden"><canvas id="canvas"></canvas>
<div id="hud"><div class="hudBox"><div class="hudName" id="hudName">Player</div><div>Level <b id="hudLevel">1</b> · Gold <b id="hudGold">100</b></div><div class="roomName" id="hudRoom">Halaman Sekolah</div><div id="hudStatus" class="offline">Menghubungkan...</div><button id="logout">Keluar</button></div></div>
<div id="joystick"><div id="joyKnob"></div></div>
<div id="chatBubbles"></div>
<div id="rightUI"><div id="actions"><div class="tearWrap"><button class="tearAction" id="actionBtn"><span>ACTION</span></button><button class="tearSkill" id="skillBtn"><span>Skill</span></button></div><button class="actionBtn" id="questBtn">Quest</button><button class="actionBtn" id="bagBtn">Tas</button></div><div id="chat"><form id="chatForm"><input id="chatInput" maxlength="120" autocomplete="off" placeholder="Tulis pesan..."><button id="chatSend">Kirim</button></form></div></div>
<div id="panel" class="panel hidden"><button class="panelClose" id="panelClose">Tutup</button><h3 id="panelTitle">Action</h3><div id="panelBody"></div></div>
<div id="toast" class="hidden"></div>
</section>
<script src="/game/rooms.js"></script>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const authMsg=t=>$('authMsg').textContent=t||'';
const WORLD=SCHOOL_WORLD,ROOMS=WORLD.rooms,ROOM_IDS=Object.keys(ROOMS);const WORLD_W=1800,WORLD_H=1050;
const SPRITES=Object.fromEntries(Array.from({length:20},(_,i)=>{const n=String(i+1).padStart(2,'0');return [`murid${n}`,`/sprites/murid${n}.png`]}));
const NPC_SPRITES=Object.fromEntries(Array.from({length:30},(_,i)=>{const n=String(i+1).padStart(2,'0');return [`npc${n}`,`/sprites/npc${n}.png`]}));
const spriteImages={};for(const [id,url] of Object.entries({...SPRITES,...NPC_SPRITES})){const im=new Image();im.src=url;spriteImages[id]=im}
let reg=false,ws=null,me=null,reconnectTimer=null,reconnectDelay=1000;let currentRoom='halaman';let facing='down',animFrame=1,walkClock=0,lastTime=performance.now(),lastSend=0;const players=new Map(),bubbles=new Map(),npcRuntime=new Map();const mePos={x:420,y:520};const input={x:0,y:0};let camera={x:0,y:0,scale:1};let joyActive=false;let pet=null;const completedQuests=new Set(JSON.parse(localStorage.getItem('school_completed_quests')||'[]'));
function room(){return ROOMS[currentRoom]||ROOMS.halaman}function api(p,o={}){return fetch(p,{credentials:'include',...o}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request gagal');return d})}
function resize(){const d=Math.min(devicePixelRatio||1,2);$('canvas').width=Math.round(innerWidth*d);$('canvas').height=Math.round(innerHeight*d);$('canvas').style.width=innerWidth+'px';$('canvas').style.height=innerHeight+'px';const c=$('canvas').getContext('2d');c.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const canvas=$('canvas'),ctx=canvas.getContext('2d');
function showToast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function sx(x){return (x-camera.x)*camera.scale}function sy(y){return (y-camera.y)*camera.scale}
function updateCamera(){const vw=innerWidth/camera.scale,vh=innerHeight/camera.scale;const targetScale=Math.min(innerWidth/Math.min(950,room().w),innerHeight/Math.min(700,room().h));camera.scale=clamp(Math.min(1.15,targetScale),.58,1.15);const vw2=innerWidth/camera.scale,vh2=innerHeight/camera.scale;camera.x=clamp(mePos.x-vw2/2,0,Math.max(0,room().w-vw2));camera.y=clamp(mePos.y-vh2/2,0,Math.max(0,room().h-vh2))}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function emoji(e,x,y,size=1){ctx.font=`${Math.max(18,28*camera.scale*size)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,sx(x),sy(y))}
function label(t,x,y){const X=sx(x),Y=sy(y),s=camera.scale;ctx.font=`800 ${Math.max(10,13*s)}px system-ui`;const w=ctx.measureText(t).width+16;rounded(X-w/2,Y-11*s,w,22*s,7,'#17241ee8','#ffffff25');ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,X,Y)}
function rectCollision(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function playerBox(x,y){return {x:x-14,y:y-11,w:28,h:22}}
function blocked(x,y){const R=room();if(x<20||y<20||x>R.w-20||y>R.h-20)return true;const box=playerBox(x,y);return (R.collision||[]).some(o=>rectCollision(box,o))}
function tryMove(dx,dy){let nx=mePos.x+dx,ny=mePos.y+dy;if(!blocked(nx,mePos.y))mePos.x=clamp(nx,20,room().w-20);if(!blocked(mePos.x,ny))mePos.y=clamp(ny,20,room().h-20)}
function drawBackground(){const R=room();ctx.fillStyle=R.bg;ctx.fillRect(0,0,innerWidth,innerHeight);const s=64*camera.scale;ctx.strokeStyle='#ffffff0d';ctx.lineWidth=1;for(let x=(-camera.x*camera.scale)%s;x<innerWidth;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,innerHeight);ctx.stroke()}for(let y=(-camera.y*camera.scale)%s;y<innerHeight;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y);ctx.stroke()}}
function drawObject(o){if(o.type==='building'){const x=sx(o.x),y=sy(o.y),w=o.w*camera.scale,h=o.h*camera.scale;rounded(x,y,w,h,8,'#e7d4a5','#806c53');ctx.fillStyle='#b04b3c';ctx.beginPath();ctx.moveTo(x-8,y+8);ctx.lineTo(x+w/2,y-30*camera.scale);ctx.lineTo(x+w+8,y+8);ctx.closePath();ctx.fill();ctx.fillStyle='#a9d4e8';for(let wx=x+22;wx<x+w-25;wx+=55*camera.scale){ctx.fillRect(wx,y+48*camera.scale,27*camera.scale,30*camera.scale)}emoji(o.emoji,o.x+o.w/2,o.y+30,1);label(o.label,o.x+o.w/2,o.y+o.h+18);return}if(o.type==='portal'){rounded(sx(o.x),sy(o.y),o.w*camera.scale,o.h*camera.scale,8,'#6e4b2ddd','#f2d37c');emoji(o.emoji,o.x+o.w/2,o.y+o.h/2,.8);label(o.label,o.x+o.w/2,o.y-14);return}if(o.type==='decor'){emoji(o.emoji,o.x,o.y,o.scale||1);return}rounded(sx(o.x),sy(o.y),o.w*camera.scale,o.h*camera.scale,9,o.type==='quest'?'#3f7f4ee6':'#7b552ee6','#ffffff25');emoji(o.emoji,o.x+o.w/2,o.y+o.h/2,.7);label(o.label,o.x+o.w/2,o.y-13)}
function drawRoom(){drawBackground();for(const o of room().objects)drawObject(o);if(room().style==='field'){for(let i=0;i<8;i++)emoji(i%2?'🌼':'🌿',160+i*150,180+(i%3)*70,.8)}if(room().style==='library'){for(let i=0;i<4;i++)emoji('📚',315+i*150,560,.9)}}
function npcBase(n){let key=currentRoom+'|'+n.id;if(!npcRuntime.has(key))npcRuntime.set(key,{x:n.x,y:n.y,tx:n.x,ty:n.y,wait:Math.random()*2});return npcRuntime.get(key)}
function updateNPCs(dt){for(const n of room().npcs||[]){const r=npcBase(n);if(n.behavior==='WALK_RANDOM'){r.wait-=dt;if(r.wait<=0){const ang=Math.random()*Math.PI*2;r.tx=clamp(r.x+Math.cos(ang)*90,40,room().w-40);r.ty=clamp(r.y+Math.sin(ang)*70,40,room().h-40);r.wait=2+Math.random()*3}}else if(n.behavior==='PATROL'&&n.path?.length){if(!r.targetIndex)r.targetIndex=0;const t=n.path[r.targetIndex];r.tx=t[0];r.ty=t[1];if(Math.hypot(r.x-r.tx,r.y-r.ty)<8)r.targetIndex=(r.targetIndex+1)%n.path.length}const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);if(d>1){const sp=n.speed||25;r.x+=dx/d*Math.min(d,sp*dt);r.y+=dy/d*Math.min(d,sp*dt)}}}
function drawSprite(x,y,sprite,direction,frame,scale=1,name=''){const im=spriteImages[sprite];if(!im||!im.complete||!im.naturalWidth)return;const rows={down:0,left:1,right:2,up:3},row=rows[direction]??0,col=((frame||1)-1)%3,s=scale*camera.scale;ctx.imageSmoothingEnabled=false;ctx.drawImage(im,col*32,row*32,32,32,sx(x)-38*s,sy(y)-68*s,76*s,76*s);ctx.imageSmoothingEnabled=true;if(name)label(name,x,y-80)}
function drawNPCs(){for(const n of room().npcs||[]){const r=npcBase(n);let d='down';if(Math.abs(r.tx-r.x)>Math.abs(r.ty-r.y))d=r.tx>r.x?'right':'left';else if(Math.abs(r.ty-r.y)>2)d=r.ty>r.y?'down':'up';const f=Math.floor(performance.now()/240)%3+1;drawSprite(r.x,r.y,n.sprite,d,f,0.82,n.name)}}
function drawPlayers(){for(const p of players.values()){if(p.room!==currentRoom)continue;p.x+=(p.targetX-p.x)*.18;p.y+=(p.targetY-p.y)*.18;drawSprite(p.x,p.y,p.sprite,p.direction,p.frame,1.0,p.name)}const f=walkClock?Math.floor(performance.now()/130)%3+1:2;drawSprite(mePos.x,mePos.y,me.character.sprite||'murid01',facing,f,1.05,String(me.character.name||'Player').slice(0,8));if(pet){const px=mePos.x-32,py=mePos.y+22;drawSprite(px,py,pet.sprite,'down',2,.55,'');}}
function renderBubbles(){const now=performance.now(),layer=$('chatBubbles');layer.replaceChildren();for(const [id,b] of bubbles){if(b.until<now){bubbles.delete(id);continue}let x,y;if(id===me.netId){x=mePos.x;y=mePos.y}else{const p=players.get(id);if(!p||p.room!==currentRoom)continue;x=p.x;y=p.y}const el=document.createElement('div');el.className='worldChat';el.textContent=b.message;el.style.left=sx(x)+'px';el.style.top=sy(y-72)+'px';layer.appendChild(el)}}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);drawRoom();drawNPCs();drawPlayers();renderBubbles();updateCamera()}
function nearestInteractive(){let best=null,bd=115;for(const o of room().objects){if(!['portal','info','quest','quiz'].includes(o.type))continue;const p={x:o.x+o.w/2,y:o.y+o.h/2};const d=Math.hypot(mePos.x-p.x,mePos.y-p.y);if(d<bd){bd=d;best=o}}for(const n of room().npcs||[]){const r=npcBase(n),d=Math.hypot(mePos.x-r.x,mePos.y-r.y);if(d<bd){bd=d;best={type:'npc',npc:n,rx:r.x,ry:r.y}}}return best}
function panel(title,html){$('panelTitle').textContent=title;$('panelBody').innerHTML=html;$('panel').classList.remove('hidden')}$('panelClose').onclick=()=>$('panel').classList.add('hidden');
function enterRoom(id,x,y,announce=true){if(!ROOMS[id])return;currentRoom=id;mePos.x=clamp(x??ROOMS[id].spawn.x,25,ROOMS[id].w-25);mePos.y=clamp(y??ROOMS[id].spawn.y,25,ROOMS[id].h-25);mePos.x=blocked(mePos.x,mePos.y)?ROOMS[id].spawn.x:mePos.x;mePos.y=blocked(mePos.x,mePos.y)?ROOMS[id].spawn.y:mePos.y;$('hudRoom').textContent=ROOMS[id].name;if(announce)showToast('Masuk: '+ROOMS[id].name);if(ws?.readyState===1)ws.send(JSON.stringify({type:'room',room:currentRoom,x:mePos.x,y:mePos.y}));}
function showObject(o){if(o.type==='portal'){enterRoom(o.targetRoom,o.targetX,o.targetY);return}if(o.type==='info'){panel(o.emoji+' '+o.label,'<p>'+esc(o.text)+'</p>');return}if(o.type==='quest'){startQuest(o.questId);return}if(o.type==='quiz'){startQuiz(o.quizId);return}}
function startQuest(id){const q=WORLD.quests[id];if(!q)return;if(completedQuests.has(id)){panel('Quest selesai','<p>Quest <b>'+esc(q.title)+'</b> sudah selesai.</p><p>Reward: '+esc(q.reward)+'</p>');return}panel('Quest: '+esc(q.title),'<p>'+esc(q.description)+'</p><button id="questStart">Mulai Quest</button>');$('questStart').onclick=()=>{const target=(room().npcs||[]).find(n=>n.id===q.requiredNpc);if(!target){showToast('Target quest tidak ada di room ini.');return}const r=npcBase(target);if(Math.hypot(mePos.x-r.x,mePos.y-r.y)>135){showToast('Dekati '+target.name+' terlebih dahulu.');return}completedQuests.add(id);localStorage.setItem('school_completed_quests',JSON.stringify([...completedQuests]));pet={sprite:'npc01',name:'Kucing'};panel('Quest selesai','<p>Berhasil! Kamu mendapatkan preview pet kucing.</p><p>Pet akan mengikuti karaktermu.</p>');showToast('Quest selesai! Pet didapat.')}}
function startQuiz(id){const qz=WORLD.quizzes[id];if(!qz)return;let i=0,score=0;function render(){const q=qz.questions[i];panel(qz.title,'<p><b>Soal '+(i+1)+'/'+qz.questions.length+'</b></p><p>'+esc(q.q)+'</p>'+q.a.map((a,k)=>`<button class="quizOpt" data-i="${k}">${esc(a)}</button>`).join(''));document.querySelectorAll('.quizOpt').forEach(btn=>btn.onclick=()=>{const k=Number(btn.dataset.i);if(k===q.correct){score++;btn.classList.add('correct')}else btn.classList.add('wrong');setTimeout(()=>{i++;if(i<qz.questions.length)render();else panel(qz.title,'<p>Kuis selesai.</p><p>Nilai: <b>'+score+'/'+qz.questions.length+'</b></p>')},450)})}render()}
$('actionBtn').onclick=()=>{const x=nearestInteractive();if(!x){panel('Action','<p>Tidak ada objek atau NPC di dekatmu.</p><p>Dekati pintu, papan, quest, kuis, atau NPC lalu tekan ACTION.</p>');return}if(x.type==='npc'){panel(x.npc.name,'<p>NPC modular.</p><p>Perilaku: '+esc(x.npc.behavior||'STAY')+'</p>');return}showObject(x)};
$('questBtn').onclick=()=>{const q=WORLD.quests.pet_cat;panel('Quest','<p><b>'+esc(q.title)+'</b></p><p>'+esc(q.description)+'</p><p>Dekati tanda 🌼 untuk memulai.</p>')};$('bagBtn').onclick=()=>panel('Tas','<p>Kapasitas awal: <b>5 slot</b>.</p><p>Sistem inventory database akan dihubungkan pada tahap berikutnya. Item yang ditemukan nantinya akan memberi pilihan <b>Ambil</b> atau <b>Tidak</b>.</p>');$('skillBtn').onclick=()=>panel('Skill','<p>Slot Skill sudah disiapkan sebagai modul.</p><p>Skill belum mengubah stat karakter pada V2.</p>');
function showBubble(id,msg){bubbles.set(id,{message:String(msg).slice(0,120),until:performance.now()+3000})}
function sendPosition(force=false){if(!ws||ws.readyState!==1)return;const now=performance.now();if(!force&&now-lastSend<90)return;lastSend=now;ws.send(JSON.stringify({type:'move',x:mePos.x,y:mePos.y,direction:facing,frame:walkClock?Math.floor(performance.now()/130)%3+1:2,room:currentRoom}))}
function addRemote(p){if(p.id===me?.netId)return;players.set(p.id,{id:p.id,x:p.x,y:p.y,targetX:p.x,targetY:p.y,name:String(p.name||'Player').slice(0,8),direction:p.direction||'down',frame:p.frame||2,sprite:p.sprite||'murid01',room:p.room||'halaman'})}
function connect(){if(!me)return;if(ws?.readyState===WebSocket.OPEN||ws?.readyState===WebSocket.CONNECTING)return;try{ws?.close()}catch{};ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onopen=()=>{reconnectDelay=1000;$('hudStatus').textContent='Online';$('hudStatus').className='online';sendPosition(true);};ws.onclose=()=>{if(!me)return;$('hudStatus').textContent='Menyambung kembali...';$('hudStatus').className='offline';scheduleReconnect()};ws.onerror=()=>{$('hudStatus').textContent='Koneksi error';$('hudStatus').className='offline'};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='welcome'){me.netId=d.playerId;currentRoom=d.self?.room||currentRoom;mePos.x=d.self?.x??mePos.x;mePos.y=d.self?.y??mePos.y;$('hudRoom').textContent=ROOMS[currentRoom]?.name||currentRoom;players.clear();(d.players||[]).forEach(addRemote)}else if(d.type==='join'){addRemote(d)}else if(d.type==='move'){if(d.id===me?.netId)return;let p=players.get(d.id);if(!p){addRemote(d);p=players.get(d.id)}p.targetX=d.x;p.targetY=d.y;p.name=String(d.name||p.name).slice(0,8);p.direction=d.direction||p.direction;p.frame=d.frame||2;p.sprite=d.sprite||p.sprite;p.room=d.room||p.room}else if(d.type==='room'){const p=players.get(d.id);if(p){p.targetX=d.x;p.targetY=d.y;p.room=d.room}}else if(d.type==='leave'){players.delete(d.id);bubbles.delete(d.id)}else if(d.type==='chat'){if(d.room===currentRoom){showBubble(d.id,d.message)}}}}
function scheduleReconnect(){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{reconnectDelay=Math.min(15000,reconnectDelay*1.7);connect()},reconnectDelay)}
function setInput(x,y){const l=Math.hypot(x,y);input.x=l?x/l:0;input.y=l?y/l:0}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){const k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')input.y=-1;if(k==='s'||e.key==='ArrowDown')input.y=1;if(k==='a'||e.key==='ArrowLeft')input.x=-1;if(k==='d'||e.key==='ArrowRight')input.x=1;e.preventDefault()}if(e.key==='e'||e.key==='Enter')$('actionBtn').click()});addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){if(e.key==='w'||e.key==='ArrowUp')input.y=0;if(e.key==='s'||e.key==='ArrowDown')input.y=0;if(e.key==='a'||e.key==='ArrowLeft')input.x=0;if(e.key==='d'||e.key==='ArrowRight')input.x=0}});
const joy=$('joystick'),knob=$('joyKnob');function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,m=42,l=Math.hypot(x,y);if(l>m){x=x/l*m;y=y/l*m}knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;setInput(x/m,y/m)}joy.onpointerdown=e=>{joyActive=true;joy.setPointerCapture(e.pointerId);joyMove(e)};joy.onpointermove=e=>{if(joyActive)joyMove(e)};function joyEnd(){joyActive=false;setInput(0,0);knob.style.transform='translate(-50%,-50%)'}joy.onpointerup=joyEnd;joy.onpointercancel=joyEnd;
$('chatForm').onsubmit=e=>{e.preventDefault();const t=$('chatInput').value.trim();if(!t||ws?.readyState!==1)return;ws.send(JSON.stringify({type:'chat',message:t}));showBubble(me.netId,t);$('chatInput').value=''};
for(const [id] of Object.entries(SPRITES)){const n=id.replace('murid','');const b=document.createElement('button');b.type='button';b.className='spriteChoice';b.innerHTML=`<span class="spritePreview" style="background-image:url('/sprites/${id}.png')"></span><span>Murid ${n}</span>`;b.onclick=()=>{selectedSprite=id;document.querySelectorAll('.spriteChoice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('spriteChoices').appendChild(b)}let selectedSprite='murid01';setTimeout(()=>$('spriteChoices').firstElementChild?.classList.add('selected'),0);
function showGame(u){me=u;selectedSprite=u.character.sprite&&SPRITES[u.character.sprite]?u.character.sprite:'murid01';currentRoom=ROOMS[u.character.map]?u.character.map:'halaman';const sp=ROOMS[currentRoom].spawn;mePos.x=sp.x;mePos.y=sp.y;$('auth').classList.add('hidden');$('game').classList.remove('hidden');$('hudName').textContent=String(u.character.name||'Player').slice(0,8);$('hudLevel').textContent=u.character.level||1;$('hudGold').textContent=u.character.gold||0;$('hudRoom').textContent=ROOMS[currentRoom].name;connect();requestAnimationFrame(loop)}
$('authBtn').onclick=async()=>{try{const body={username:$('username').value.trim(),password:$('password').value};if(reg){body.characterName=$('characterName').value.trim();body.sprite=selectedSprite}const d=await api(reg?'/api/register':'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});showGame(d.user)}catch(e){authMsg(e.message)}};$('switchBtn').onclick=()=>{reg=!reg;$('authTitle').textContent=reg?'Buat akun baru':'Masuk ke dunia sekolah';$('authBtn').textContent=reg?'Daftar':'Login';$('switchBtn').textContent=reg?'Sudah punya akun':'Buat akun baru';$('characterName').classList.toggle('hidden',!reg);$('spritePicker').classList.toggle('hidden',!reg);authMsg('')};$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
addEventListener('online',()=>{if(me)connect()});addEventListener('visibilitychange',()=>{if(!document.hidden&&me){connect();sendPosition(true)}});addEventListener('pageshow',()=>{if(me)connect()});
function update(dt){const speed=190;const moving=Math.hypot(input.x,input.y)>.05;walkClock=moving?1:0;if(moving){const len=Math.hypot(input.x,input.y)||1;tryMove(input.x/len*speed*dt,input.y/len*speed*dt);if(Math.abs(input.x)>Math.abs(input.y))facing=input.x>0?'right':'left';else facing=input.y>0?'down':'up';sendPosition()}updateNPCs(dt);if(pet){pet.x=mePos.x-32;pet.y=mePos.y+22}const x=nearestInteractive();}
function loop(t){const dt=Math.min(.05,(t-lastTime)/1000);lastTime=t;update(dt);updateCamera();draw();requestAnimationFrame(loop)}
(async()=>{try{const d=await api('/api/me');if(d.authenticated)showGame(d.user)}catch{}})();
</script>
</body>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cloudflare MMO v1</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:18px;margin:12px 0}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #4b5563;margin:5px 0;font-size:16px}button{background:#2563eb;color:#fff;border:0;font-weight:700}button.secondary{background:#374151}.hidden{display:none!important}#game{position:relative;height:58vh;min-height:360px;overflow:hidden;border-radius:16px;background:#7fb069;border:2px solid #374151}#world{position:absolute;left:0;top:0;width:2000px;height:1200px;background:linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:40px 40px}.player{position:absolute;width:42px;height:42px;border-radius:10px;background:#2563eb;border:3px solid #fff;transform:translate(-50%,-50%);text-align:center;font-size:9px;padding-top:45px;white-space:nowrap}.me{background:#dc2626}.row{display:flex;gap:8px}.row>*{flex:1}#hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#hud span{background:#111827;padding:8px 10px;border-radius:9px}#logout{width:auto;margin-left:auto}.status{font-size:13px;color:#cbd5e1}</style></head><body><div class="wrap"><h1>Cloudflare MMO v1</h1><section id="auth" class="card"><h2 id="authTitle">Login</h2><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><input id="characterName" placeholder="Nama karakter" class="hidden"><button id="authBtn">Login</button><button id="switchBtn" class="secondary">Buat akun baru</button><p id="authMsg"></p></section><section id="gameCard" class="hidden"><div class="card"><div id="hud"><span>👤 <b id="charName"></b></span><span>Level <b id="level">1</b></span><span>Gold <b id="gold">100</b></span><span id="status">Menghubungkan...</span><button id="logout" class="secondary">Logout</button></div></div><div id="game"><div id="world"></div></div><div class="card"><b>Kontrol</b><div>PC: WASD / panah. HP: tombol di bawah.</div><div class="row"><button data-key="up">↑</button></div><div class="row"><button data-key="left">←</button><button data-key="down">↓</button><button data-key="right">→</button></div></div></section></div><script>let reg=false,ws=null,me=null,x=450,y=350;const speed=12,players=new Map(),world=document.getElementById('world');const msg=t=>document.getElementById('authMsg').textContent=t;async function api(p,o={}){const r=await fetch(p,{credentials:'include',...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request gagal');return d}function show(u){me=u;auth.classList.add('hidden');gameCard.classList.remove('hidden');charName.textContent=u.character.name;level.textContent=u.character.level;gold.textContent=u.character.gold;connect()}function setp(id,a,b,n,m){let e=players.get(id);if(!e){e=document.createElement('div');e.className='player';world.appendChild(e);players.set(id,e)}e.classList.toggle('me',m);e.textContent=n||'Player';e.style.left=a+'px';e.style.top=b+'px'}function del(id){const e=players.get(id);if(e){e.remove();players.delete(id)}}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onopen=()=>status.textContent='Online';ws.onclose=()=>status.textContent='Terputus';ws.onerror=()=>status.textContent='Error';ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='welcome'){d.players.forEach(p=>setp(p.id,p.x,p.y,p.name,p.id===d.playerId));me.netId=d.playerId}if(d.type==='join')setp(d.id,d.x,d.y,d.name,false);if(d.type==='move'){const old=players.get(d.id);setp(d.id,d.x,d.y,old?.textContent,d.id===me.netId)}if(d.type==='leave')del(d.id)}}function move(dx,dy){x=Math.max(0,Math.min(2000,x+dx));y=Math.max(0,Math.min(1200,y+dy));const e=players.get(me?.netId);if(e){e.style.left=x+'px';e.style.top=y+'px'}if(ws?.readyState===1)ws.send(JSON.stringify({type:'move',x,y}))}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='w'||k==='arrowup')move(0,-speed);if(k==='s'||k==='arrowdown')move(0,speed);if(k==='a'||k==='arrowleft')move(-speed,0);if(k==='d'||k==='arrowright')move(speed,0)});document.querySelectorAll('[data-key]').forEach(b=>b.onpointerdown=()=>{const k=b.dataset.key;if(k==='up')move(0,-speed);if(k==='down')move(0,speed);if(k==='left')move(-speed,0);if(k==='right')move(speed,0)});authBtn.onclick=async()=>{try{const body={username:username.value,password:password.value};if(reg)body.characterName=characterName.value;show((await api(reg?'/api/register':'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})).user)}catch(e){msg(e.message)}};switchBtn.onclick=()=>{reg=!reg;authTitle.textContent=reg?'Buat akun':'Login';authBtn.textContent=reg?'Daftar':'Login';switchBtn.textContent=reg?'Sudah punya akun':'Buat akun baru';characterName.classList.toggle('hidden',!reg);msg('')};logout.onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};(async()=>{try{const d=await api('/api/me');if(d.authenticated)show(d.user)}catch{}})();</script></body></html>
